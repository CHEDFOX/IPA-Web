# Running without Docker. Put this in /etc/nginx/sites-available/ipa-web, link it into
# sites-enabled, then run certbot --nginx -d yourdomain.com -d www.yourdomain.com.

server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com;

    # Photos and video are uploaded through the admin panel.
    client_max_body_size 1024M;

    # A long video upload takes a while to process.
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # The admin panel should never be indexed or framed.
    location /admin {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Frame-Options DENY always;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
