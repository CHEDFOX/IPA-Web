# For a server whose nginx already serves other sites. Put the site on a local port with
#   cd /opt/ipa-web && docker compose up -d        (no Caddy)
# then enable this file and let certbot add the TLS block:
#
#   cp deploy/nginx-site.conf /etc/nginx/sites-available/ipa-web.conf
#   ln -sf /etc/nginx/sites-available/ipa-web.conf /etc/nginx/sites-enabled/ipa-web.conf
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d yourdomain.com -d www.yourdomain.com
#
# install.sh writes a copy with your domain and port already filled in.

# The bare domain redirects to www, which is the address the site calls its own.
server {
    listen 80;
    listen [::]:80;
    server_name yourdomain.com;
    return 301 https://www.yourdomain.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name www.yourdomain.com;

    # Photos and video are uploaded through the admin panel.
    client_max_body_size 1024M;

    # A long video takes a while to process after it finishes uploading.
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_request_buffering off;

    # The admin panel should never be indexed or framed.
    location /admin {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Frame-Options DENY always;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Without this the site thinks visitors arrived over plain http and marks its
        # cookies accordingly.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
