# The site plus Caddy, which gets and renews the HTTPS certificate on its own.
#
#   cp .env.example .env && nano .env     # DOMAIN, ADMIN_PASSWORD, NEXT_PUBLIC_SITE_URL
#   docker compose up -d --build
#
# Everything that matters lives in the ipa-data volume: back that up.

services:
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # Where the database and the uploaded photos live inside the container.
      IPA_DATA_DIR: /app/data
      PORT: 3000
    volumes:
      - ipa-data:/app/data
    # Only reachable from the server itself: a proxy in front publishes it. IPA_PORT lets it
    # move out of the way of anything already using 3000 on this machine.
    ports:
      - '127.0.0.1:${IPA_PORT:-3000}:3000'

  # Only for a server with nothing else on ports 80 and 443. Start it with
  #   docker compose --profile caddy up -d
  # On a machine that already runs nginx or Apache, leave it off and proxy to IPA_PORT.
  caddy:
    image: caddy:2-alpine
    profiles: ['caddy']
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    env_file: .env
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  ipa-data:
  caddy-data:
  caddy-config:
